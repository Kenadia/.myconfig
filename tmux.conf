# reload config
bind r source-file ~/.tmux.conf

# remap prefix
# unbind C-b
# set-option -g prefix C-q
# bind-key C-q send-prefix

# no delay for meta-shortcuts
set -sg escape-time 0

# select windows without prefix
bind -n M-[ select-window -p
bind -n M-] select-window -n

# zoom/unzoom pane without prefix
bind -n M-z resize-pane -Z

# select adjacent pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# select adjacent pane while keeping zoom state
bind h run-shell 'ZOOM=$(tmux display-message -p "#{window_zoomed_flag}"); if [ "$ZOOM" = "1" ]; then tmux resize-pane -Z; fi; tmux select-pane -L; if [ "$ZOOM" = "1" ]; then tmux resize-pane -Z; fi'
bind j run-shell 'ZOOM=$(tmux display-message -p "#{window_zoomed_flag}"); if [ "$ZOOM" = "1" ]; then tmux resize-pane -Z; fi; tmux select-pane -D; if [ "$ZOOM" = "1" ]; then tmux resize-pane -Z; fi'
bind k run-shell 'ZOOM=$(tmux display-message -p "#{window_zoomed_flag}"); if [ "$ZOOM" = "1" ]; then tmux resize-pane -Z; fi; tmux select-pane -U; if [ "$ZOOM" = "1" ]; then tmux resize-pane -Z; fi'
bind l run-shell 'ZOOM=$(tmux display-message -p "#{window_zoomed_flag}"); if [ "$ZOOM" = "1" ]; then tmux resize-pane -Z; fi; tmux select-pane -R; if [ "$ZOOM" = "1" ]; then tmux resize-pane -Z; fi'

# select numbered pane while keeping zoom state
#
# M-1: go to pane #0
bind -n M-1 if-shell '[ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]' \
  'run-shell "tmux resize-pane -Z; tmux select-pane -t 0; sleep 0.01; tmux resize-pane -Z"' \
  'select-pane -t 0'

# M-2: go to pane #1
bind -n M-2 if-shell '[ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]' \
  'run-shell "tmux resize-pane -Z; tmux select-pane -t 1; sleep 0.01; tmux resize-pane -Z"' \
  'select-pane -t 1'

# M-3: go to pane #2
bind -n M-3 if-shell '[ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]' \
  'run-shell "tmux resize-pane -Z; tmux select-pane -t 2; sleep 0.1; tmux resize-pane -Z"' \
  'select-pane -t 2'

# M-4: go to pane #3
bind -n M-4 if-shell '[ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]' \
  'run-shell "tmux resize-pane -Z; tmux select-pane -t 3; sleep 0.1; tmux resize-pane -Z"' \
  'select-pane -t 3'

# M-5: go to pane #4
bind -n M-5 if-shell '[ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]' \
  'run-shell "tmux resize-pane -Z; tmux select-pane -t 4; sleep 0.1; tmux resize-pane -Z"' \
  'select-pane -t 4'

# M-6: go to pane #5
bind -n M-6 if-shell '[ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]' \
  'run-shell "tmux resize-pane -Z; tmux select-pane -t 5; sleep 0.1; tmux resize-pane -Z"' \
  'select-pane -t 5'

# M-7: go to pane #6
bind -n M-7 if-shell '[ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]' \
  'run-shell "tmux resize-pane -Z; tmux select-pane -t 6; sleep 0.1; tmux resize-pane -Z"' \
  'select-pane -t 6'

# M-8: go to pane #7
bind -n M-8 if-shell '[ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]' \
  'run-shell "tmux resize-pane -Z; tmux select-pane -t 7; sleep 0.1; tmux resize-pane -Z"' \
  'select-pane -t 7'


# split panes using | and -
# also, open new panes to the same/current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# open new windows to the same/current path
bind c new-window -c "#{pane_current_path}"

# other
set -g base-index 1
set-option -g set-titles on
set-option -g allow-rename off
set-option -g history-limit 10000

# theme
